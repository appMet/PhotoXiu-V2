name: Build Apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *Merged*.zip 2>/dev/null | head -n1)
          [ -z "$ZIP" ] && ZIP=$(ls *.zip | head -n1)
          echo "Using $ZIP"
          mkdir proj
          unzip -q "$ZIP" -d proj
          DIR=$(dirname "$(find proj -name settings.gradle | head -n1)")
          echo "DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd "$DIR" && gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoXiuV2-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
